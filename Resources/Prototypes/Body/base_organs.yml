- type: markingsGroup
  id: None
  onlyGroupWhitelisted: true

- type: markingsGroup
  id: Undergarments
  limits:
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentTopTanktop ]
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentBottomBoxers ]

- type: entity
  id: OrganBase
  name: organ
  abstract: true
  parent: BaseItem
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Piercing
        damage: 600
      behaviors:
      - !type:GibBehavior
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior
  - type: Organ

- type: entity
  id: OrganBaseOrganic
  name: organ
  abstract: true
  parent: [ OrganBase, SolutionFood, SolutionTiny ]
  components:
  - type: FlavorProfile
    flavors:
    - chicken # INTRODUCING OUR NEW EVERY-MEAT BURRITO, IT'S GOT EVERY MEAT!
  - type: Edible
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
  - type: Tag # I am nearing my limit of tolerance for TagComponent.
    tags:
    - Raw
    - Meat
  - type: Perishable
    rotAfter: 480

- type: entity
  parent:
  - OrganBase
  - OrganBaseParent
  id: OrganBaseTorso
  name: torso
  abstract: true
  components:
  - type: Organ
    category: Torso
  - type: Sprite
    state: torso
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Chest
    data:
      state: torso
  - type: BodyPart
    partType: Torso
    slots:
    # parts
    - Head
    - ArmLeft
    - ArmRight
    - LegLeft
    - LegRight
    # organs
    - Appendix
    - Lungs
    - Heart
    - Stomach
    - Liver
    - Kidneys
  - type: BodyPartCavity
    whitelist:
      sizes:
      - Tiny
      - Small
  - type: UnremoveableOrgan
  - type: Bone
  - type: CoveredPart
  - type: Appearance
  - type: WoundableVisuals
    thresholds: [ 100, 70, 50, 30, 20, 10 ]
    damageGroupSprites:
      Brute: _Trauma/Mobs/Effects/brute_damage.rsi
      Burn: _Trauma/Mobs/Effects/burn_damage.rsi
    bleedingOverlay: _Trauma/Mobs/Effects/bleeding_damage.rsi
  - type: ContainerContainer
    containers:
      Wounds: !type:Container
      body_part_organs: !type:Container
  - type: Woundable
    canRemove: false
    integrity: 100
    integrityCap: 100
    thresholds:
      Minor: 90
      Moderate: 70
      Severe: 45
      Critical: 20
      Mangled: 0
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special


# Magazines and speedloaders
- type: entity
  parent: MagazinePistol
  id: MagazinePistolHP
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolHP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: stripe
      color: "#006c68"
  - type: Item
    inhandVisuals:
      left:

- type: markingsGroup
  parent: Undergarments
  id: Veiru
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      onlyGroupWhitelisted: true
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ VeiruOutears ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ VeiruMuzzle ]
    enum.HumanoidVisualLayers.SnoutCover:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ VeiruTailM ]
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentTopTanktop ]
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
      nudityDefault: [ UndergarmentBottomBoxers ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceVeiru
  categories: [ HideSpawnMenu ] 
  name: Veiru appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganVeiruTorso
      Head: OrganVeiruHead
      ArmLeft: OrganVeiruArmLeft
      ArmRight: OrganVeiruArmRight
      HandRight: OrganVeiruHandRight
      HandLeft: OrganVeiruHandLeft
      LegLeft: OrganVeiruLegLeft
      LegRight: OrganVeiruLegRight
      FootLeft: OrganVeiruFootLeft
      FootRight: OrganVeiruFootRight
      Brain: OrganVeiruBrain
      Eyes: OrganVeiruEyes
      Tongue: OrganVeiruTongue
      Appendix: OrganVeiruAppendix
      Ears: OrganVeiruEars
      Lungs: OrganVeiruLungs
      Heart: OrganVeiruHeart
      Stomach: OrganVeiruStomach
      Liver: OrganVeiruLiver
      Kidneys: OrganVeiruKidneys
  - type: HumanoidProfile
    species: Veiru
  - type: Inventory
    speciesId: veiru
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Ashfall/Veiru/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: Ashfall/Veiru/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Ashfall/Veiru/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: Ashfall/Veiru/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: Ashfall/Veiru/displacement.rsi
            state: outerclothing

- type: entity
  save: false
  name: Urist McVeiru
  parent:
  - AppearanceVeiru
  - BaseSpeciesMobOrganic
  id: MobVeiru
  components:
  - type: Satiation
    satiations:
      Hunger:
        prototype: VeiruHunger
      Thirst:
        prototype: VeiruThirst
  - type: ContentEye
  - type: Speech
    allowedEmotes: ['Purr', 'Meow']
  - type: Vocal
    emoteSounds: MaleVeiru
  - type: GrowlingAccent
  - type: MeleeWeapon
    animation: WeaponArcClaw
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Slash: 7
  - type: Damageable
    damageModifierSet: Veiru
  - type: Injurable
    damageContainer: Biological
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2.0
    damageRecovery:
      types:
        Asphyxiation: -2.0
  - type: Wagging
  

